name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        # Use `npm install` (not `npm ci`) because the lockfile is generated on
        # Windows and omits Linux-only optional deps (e.g. @emnapi/*) that `npm ci`
        # on ubuntu would otherwise demand.
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
