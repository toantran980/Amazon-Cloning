services:
  postgres:
    image: postgres:18-alpine
    container_name: amazon_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amazon_clone
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ keeps data in a subdirectory, so the volume must mount at
      # the parent /var/lib/postgresql (see docker-library/postgres#1259).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amazon_clone"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: amazon_server
    restart: always
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/amazon_clone
      JWT_SECRET: super-secret-jwt-key-amazon-clone-2026
      PORT: 3001
      CLIENT_ORIGIN: http://localhost
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amazon_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
